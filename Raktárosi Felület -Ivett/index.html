<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raktárosi felület</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- auth-pending: a felület rejtve marad, amíg a bejelentkezés ellenőrzése tart (app.js) -->
<body class="auth-pending">
  <div class="app">

    <!-- ========== OLDALSÁV ========== -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">☀</div>
        <div class="logo-text">
          <strong>SolarSystem</strong>
          <span>Raktárosi felület</span>
        </div>
      </div>

      <nav class="navigation">
        <a href="#projektek" class="nav-item" data-view="projektek">
          <span class="nav-icon">▤</span><span>Projektek</span>
        </a>
        <a href="#kivetelezes" id="nav-kivetelezes" class="nav-item" data-view="kivetelezes">
          <span class="nav-icon">⇧</span><span>Kivételezés</span>
        </a>
        <a href="#utvonal" id="nav-utvonal" class="nav-item" data-view="utvonal">
          <span class="nav-icon">⇢</span><span>Útvonal</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <span id="mode-badge" class="mode-badge" hidden></span>
        <button type="button" id="reset-demo" class="nav-item nav-button" hidden>
          <span class="nav-icon">↺</span><span>Demo adatok visszaállítása</span>
        </button>
        <button type="button" id="logoutButton" class="nav-item nav-button">
          <span class="nav-icon">↪</span><span>Kijelentkezés</span>
        </button>
      </div>
    </aside>

    <!-- ========== FŐ TARTALOM ========== -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title"></h1>
          <p id="page-sub"></p>
        </div>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar" aria-hidden="true"></div>
          <div class="user-details">
            <strong id="user-name"></strong>
            <span id="user-role"></span>
          </div>
        </div>
      </header>

      <section id="view" class="page"></section>
    </main>
  </div>

  <dialog id="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
