<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bejelentkezés – SolarSystem</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    KÖZÖS BEJELENTKEZÉS

    Mindhárom felület egyetlen belépő oldalt használ. Itt a users tábla
    BÁRMELYIK fiókjával be lehet lépni; a szerepkör (users.role) dönti el,
    hogy melyik felületre jut a felhasználó:

        specialist         → szakemberi felület      (Attila)
        warehouse_manager  → raktárvezetői felület   (Ábel)
        warehouse_worker   → raktárosi felület       (Ivett)

    A jelszó ellenőrzése a szerveren történik (api/login.php, password_verify),
    az irányítás pedig a válaszban kapott szerepkör alapján. A felületek maguk
    is újra ellenőrzik a szerepkört (api/me.php), tehát az URL kézi beírásával
    nem lehet idegen felületre bejutni.
  -->
  <main class="belepo-lap">
    <div class="belepo-kartya">

      <div class="logo">
        <div class="logo-ikon" aria-hidden="true">☀</div>
        <div class="logo-szoveg">
          <strong>SolarSystem</strong>
          <span>Napelemrendszer-telepítés</span>
        </div>
      </div>

      <form id="belepo-urlap" novalidate>
        <h1>Bejelentkezés</h1>
        <p class="belepo-alcim">Lépj be a felhasználóneveddel – a szerepköröd
          alapján a megfelelő felületre kerülsz.</p>

        <div id="belepo-info" class="belepo-info" role="status" hidden></div>
        <div id="belepo-hiba" class="belepo-hiba" role="alert" hidden></div>

        <label class="mezo">
          <span>Felhasználónév</span>
          <input class="beviteli" id="felhasznalonev" name="username"
                 autocomplete="username" required autofocus>
        </label>

        <div class="mezo">
          <label for="jelszo">Jelszó</label>
          <div class="jelszo-doboz">
            <input class="beviteli" id="jelszo" name="password" type="password"
                   autocomplete="current-password" required>
            <!-- Szem gomb: megmutatja / elrejti a beírt jelszót -->
            <button type="button" class="jelszo-mutat" id="jelszo-mutat"
                    aria-label="Jelszó megjelenítése" aria-pressed="false" title="Jelszó megjelenítése">
              <svg class="szem-nyitott" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="szem-csukott" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/>
                <path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="gomb fo" id="belepo-gomb">Bejelentkezés</button>
      </form>

    </div>
  </main>

  <script src="js/belepes.js"></script>
</body>
</html>
